name: Jesus Crypto Staging QA

on:
  push:
    branches: [jesus-crypto-p01-staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa-portals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run P01-P10 static QA
        run: node scripts/qa-portals.mjs
      - name: Build release manifest dry-run
        run: |
          node scripts/build-release-manifest.mjs > /tmp/jesus-crypto-release-manifest.json
          node -e "const m=require('/tmp/jesus-crypto-release-manifest.json'); if(Object.keys(m.files).length<15) process.exit(1); console.log('Release manifest inputs:',Object.keys(m.files).length)"
